<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glamora</title>
<meta name="theme-color" content="#f8eef2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glamora">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-only, one screen. Header (day + menu), "+ Programare nouă", then one scroll area (both axes) with three wide stylist columns on a 15-minute grid. Single soft-pink light theme by choice. */
:root{
  color-scheme:light;
  --bg:#f8eef2; --surface:#ffffff; --surface-2:#fbf5f7; --line:#ead9e0; --line-soft:#f3e8ec;
  --fg:#241a1f; --muted:#7f6c75; --accent:#8a3358; --accent-fg:#ffffff; --accent-soft:#f6e1ea;
  --appt-bg:#fdf3f7; --ok:#2f7a4f; --ok-bg:#e3f2e8; --bad:#b03636;
  --wa:#1f8f4e; --call:#2f6fb5;
  --tina:#c2577f; --mymy:#7b5cc4; --irina:#2f8f7f;
  --colw:190px;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ppm:3.8;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
.top{display:flex;align-items:center;gap:6px;padding:10px 12px 8px}
.btn{border:1px solid var(--line);background:var(--surface);min-height:44px;padding:0 14px;border-radius:12px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.icon{width:44px;padding:0;font-size:22px;flex:none}
.datebtn{flex:1 1 auto;min-width:0;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 8px;min-height:48px;display:flex;flex-direction:column;justify-content:center}
.datebtn .d{font-weight:700;font-size:16px;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebtn .s{font-size:12px;color:var(--muted)}
.addrow{padding:0 12px 10px}
.addrow .btn{width:100%;min-height:48px;font-size:16px}
.notice{background:#fff6e0;color:#7a5a10;border-radius:10px;padding:10px 12px;font-size:14px;margin:0 12px 8px}

/* scroll area: horizontal for the wide columns, vertical for the hours */
.scroller{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;margin:0 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;overscroll-behavior:contain}
.grid{display:grid;grid-template-columns:repeat(3,minmax(var(--colw),1fr));min-width:calc(var(--colw) * 3)}
.colhead{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:3px solid;border-right:1px solid var(--line);padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.colhead:nth-child(3){border-right:0}
.colhead .nm{font-weight:700;font-size:16px;white-space:nowrap}
.colhead .rl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.col{position:relative;border-right:1px solid var(--line);min-width:0}
.col:last-child{border-right:0}
.slot{position:absolute;left:0;right:0;border:0;border-top:1px solid var(--line-soft);background:transparent;padding:3px 0 0 6px;text-align:left;font-family:var(--f-mono);font-size:11px;color:#b9a6ae;line-height:1}
.slot.hour{border-top:1px solid var(--line);color:var(--muted);font-weight:500}
.slot:active{background:var(--accent-soft)}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--bad);z-index:3;pointer-events:none}
.appt{position:absolute;left:44px;right:3px;z-index:2;border-radius:8px;padding:3px 7px;justify-content:flex-start;gap:1px;text-align:left;border:1px solid var(--line);border-left:4px solid;background:var(--appt-bg);overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:0 1px 3px rgba(90,30,55,.12)}
.appt .t{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.appt .c{font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt.block{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,#f0e4e9 6px 12px);border-left-color:var(--muted)!important;box-shadow:none}
.appt.block .c{color:var(--muted)}
.appt .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(40,15,28,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 8px calc(env(safe-area-inset-bottom,0px) + 18px)}
.scrim.top{z-index:40}
.sheet{background:var(--surface);width:100%;max-width:560px;height:100%;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.sheet.fit{height:auto;max-height:100%}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line-soft)}
.sheet-head h2{font-size:19px;font-weight:700;margin:0;flex:1}
.sheet-body{flex:1;overflow:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line-soft);background:var(--surface)}
.sheet-foot .btn{flex:1;min-height:50px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;position:relative}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.field input,.field select,.field textarea,.field .pick{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;min-height:48px;font-size:16px;width:100%;-webkit-appearance:none;appearance:none;text-align:left}
.field .pick{text-transform:capitalize;font-weight:600}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.field textarea{padding:10px 12px;min-height:70px;resize:vertical}
.staffpick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.staffpick button{min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700;font-size:15px;border-bottom-width:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.staffpick button small{font-weight:500;font-size:11px;color:var(--muted)}
.staffpick button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.combo-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(90,30,55,.18);max-height:240px;overflow:auto}
.combo-list.up{top:auto;bottom:100%;margin:0 0 4px}
.combo-list button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-top:1px solid var(--line-soft);background:transparent;padding:12px;font-size:16px;min-height:46px}
.combo-list button:first-child{border-top:0}
.combo-list button span{color:var(--muted);font-size:13px;white-space:nowrap}
.combo-list .none{padding:12px;color:var(--muted);font-size:14px}
.status span{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.hint{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-size:14px;font-weight:600}
.contact{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.contact a,.contact button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border-radius:12px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.contact svg{width:20px;height:20px}
.contact .call{color:var(--call);border-color:var(--call)}
.contact .sms{color:var(--accent);border-color:var(--accent)}
.contact .wa{color:var(--wa);border-color:var(--wa)}
.contact .cp{color:var(--muted)}
.contact[aria-disabled="true"]{opacity:.4;pointer-events:none}
.phone-show{font-family:var(--f-mono);font-size:13px;color:var(--muted);user-select:all}

/* compact appointment sheet: everything fits on one phone screen */
.sheet.compact .sheet-head{padding:8px 6px 8px 16px}
.sheet.compact .sheet-head h2{font-size:18px;line-height:1.2}
.okline{font-size:12px;font-weight:600;color:var(--ok)}
.hicons{display:flex;gap:4px}
.hicons a{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.hicons svg{width:19px;height:19px}
.hicons .call{color:var(--call)} .hicons .sms{color:var(--accent)} .hicons .wa{color:var(--wa)}
.hicons[aria-disabled="true"]{opacity:.3;pointer-events:none}
.sheet.compact .sheet-body{padding:12px 16px;overflow:visible}
.cform{display:flex;flex-direction:column;gap:clamp(8px,1.8vh,16px)}
.trio{display:grid;grid-template-columns:1.25fr .85fr 1fr;gap:8px}
.cform .field{gap:4px}
.cform .field>label,.cform .lbl{font-size:11px}
.cform .field input,.cform .field select,.cform .field .pick{min-height:46px;padding:0 10px}
.trio .field select{padding-right:22px;background-position:calc(100% - 14px) 20px,calc(100% - 9px) 20px}
.trio .pick{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.cform .staffpick button{min-height:46px}
.sheet.compact .sheet-foot .btn{min-height:50px}
.sheet.compact .sheet-foot .danger{flex:0 0 auto;padding:0 14px}

.stpick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stpick button{min-height:42px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:600;font-size:14px;color:var(--muted)}
.stpick button.st-acceptata[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.stpick button.st-confirmata[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.stpick button.st-anulata[aria-pressed="true"]{background:#f8e3e3;border-color:var(--bad);color:var(--bad)}
.crow{display:grid;grid-template-columns:.75fr .7fr 1.3fr 1.15fr;gap:5px;margin-top:6px}
.crow a{display:flex;align-items:center;justify-content:center;gap:4px;min-height:40px;border-radius:10px;border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap;padding:0 2px;overflow:hidden}
.crow svg{width:16px;height:16px;flex:none}
.crow .call{color:var(--call);border-color:var(--call)} .crow .sms{color:var(--accent);border-color:var(--accent)}
.crow .smsd{background:var(--accent);color:#fff;border-color:var(--accent)} .crow .wa{color:var(--wa);border-color:var(--wa)}
.crow[aria-disabled="true"]{opacity:.35;pointer-events:none}
.appt.st-confirmata{background:var(--ok-bg)}
.appt.st-anulata{background:#f8e3e3;opacity:.7}
.appt.st-anulata .c{text-decoration:line-through}

/* calendar */
.cal{padding:12px 14px 16px}
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal-head .m{flex:1;text-align:center;font-weight:700;font-size:17px;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid .wd{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0}
.cal-grid button{aspect-ratio:1;max-width:100%;border:1px solid transparent;background:transparent;border-radius:12px;font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.cal-grid button.today{border-color:var(--accent);color:var(--accent);font-weight:700}
.cal-grid button.sel{background:var(--accent);color:var(--accent-fg);font-weight:700}
.cal-grid button.sun{color:var(--muted)}
.cal-foot{display:flex;gap:8px;margin-top:12px}
.cal-foot .btn{flex:1}

/* menu drawer */
.drawer-scrim{position:fixed;inset:0;background:rgba(40,15,28,.45);z-index:25;display:flex;justify-content:flex-end}
.drawer{width:min(82vw,340px);height:100%;background:var(--surface);padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:6px}
.drawer h2{font-size:20px;margin:4px 4px 0}
.drawer .sub{color:var(--muted);font-size:13px;margin:0 4px 12px}
.drawer button.item{display:flex;align-items:center;gap:12px;text-align:left;border:0;background:transparent;min-height:52px;padding:0 10px;border-radius:12px;font-size:16px;font-weight:600}
.drawer button.item:active{background:var(--accent-soft)}
.drawer button.item svg{width:22px;height:22px;color:var(--accent)}

/* client list */
.row{display:flex;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line-soft)}
.row .main{flex:1 1 auto;min-width:0}
.row .main b{display:block}
.row .sub{color:var(--muted);font-size:13px}
.mini{display:flex;gap:4px}
.mini a{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.mini a svg{width:18px;height:18px}
.mini .call{color:var(--call)} .mini .wa{color:var(--wa)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.search{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;min-height:48px;font-size:16px;width:100%}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:down .18s ease-out}@keyframes down{from{transform:translateY(-16px);opacity:.7}}.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.7}}}
/* standalone app additions */
html,body{margin:0}
[hidden]{display:none!important}
.app{padding-top:env(safe-area-inset-top,0px)}
.who{display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.who span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.drawer .danger-item{color:var(--bad)}
.drawer .danger-item svg{color:var(--bad)!important}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.kv span{color:var(--muted)}
.kv b{text-align:right;overflow-wrap:anywhere}
.who-pick{flex-direction:column;align-items:flex-start;min-height:60px;padding:8px 14px;text-align:left}
.who-pick span{font-weight:500;font-size:13px;color:var(--muted)}
/* login */
.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--bg);overflow:auto}
.login .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 20px 22px;box-shadow:0 12px 40px rgba(90,30,55,.12)}
.brandmark{font-family:"Bodoni Moda",Georgia,serif;font-weight:700;font-size:44px;letter-spacing:.01em;color:var(--accent);text-align:center;line-height:1}
.brandsub{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:8px 0 24px}
.login .cform .field input{min-height:50px}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:8px}
.pw input{padding-right:84px!important}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:10px;margin:4px auto 0;display:block}
.splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
</style>
</head>
<body>

<div class="splash" id="splash"><div class="brandmark">Glamora</div></div>
<div class="login" id="login" hidden>
  <div class="card">
    <div class="brandmark">Glamora</div>
    <div class="brandsub">Salon Vintage</div>
    <form class="cform" id="lForm" autocomplete="on">
      <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" inputmode="email" autocapitalize="none" required></div>
      <div class="field"><label for="lPass">Parolă</label><div class="pw"><input id="lPass" type="password" autocomplete="current-password" required style="width:100%"><button type="button" id="lShow">Arată</button></div></div>
      <div class="warn" id="lErr" hidden></div>
      <button class="btn primary" id="lBtn" type="submit" style="min-height:52px;font-size:16px">Intră în cont</button>
    </form>
    <button type="button" class="linkbtn" id="lForgot">Am uitat parola</button>
  </div>
</div>


<div class="app" id="appRoot" hidden>
  <div class="top">
    <button class="btn icon" id="prevDay" aria-label="Ziua anterioară">‹</button>
    <button class="datebtn" id="dateBtn" aria-label="Alege data din calendar"><span class="d" id="dateLabel"></span><span class="s" id="dateSub"></span></button>
    <button class="btn icon" id="nextDay" aria-label="Ziua următoare">›</button>
    <button class="btn icon" id="menuBtn" aria-label="Meniu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="dbNotice" class="notice" hidden>Ești offline. Modificările se salvează automat când revine internetul.</div>
  <div class="addrow"><button class="btn primary" id="newBtn">+ Programare nouă</button></div>
  <div class="scroller" id="scroller"><div class="grid" id="grid"></div></div>
</div>

<div id="modal" class="scrim" hidden></div>
<div id="calModal" class="scrim top" hidden></div>
<div id="drawer" class="drawer-scrim" hidden></div>
<div id="toast" class="toast" hidden></div>


<script type="module" src="./app.js?v=1791738790"></script>
</body>
</html>
